[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "quant-ai-research"
version = "0.1.0"
description = "Reproducible financial research and Qlib learning laboratory"
requires-python = ">=3.11,<3.12"
dependencies = [
  "editables==0.5",
  "numpy==1.26.4", "pandas==2.2.3", "scipy==1.15.3",
  "statsmodels==0.14.5", "yfinance==0.2.66", "matplotlib==3.10.7",
  "seaborn==0.13.2", "plotly==6.3.1", "pyarrow==20.0.0",
  "scikit-learn==1.7.2", "lightgbm==4.6.0", "pyqlib==0.9.7",
  "mlflow==3.1.0",
  "jupyterlab==4.4.10", "ipykernel==6.30.1",
]

[project.optional-dependencies]
torch = ["torch==2.7.1+cpu"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3", "nbclient==0.10.2"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/quant_ai"]

# Windows CP932でも日本語パスを含むeditable installが起動できるimport hookを使う。
[tool.hatch.build]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

